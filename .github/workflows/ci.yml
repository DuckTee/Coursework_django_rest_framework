  deploy:
    # needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          # Check if Docker is installed, if not install it
          if ! command -v docker &> /dev/null; then
            echo "Docker not found. Installing Docker..."
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg lsb-release
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            sudo usermod -aG docker $USER || true
          fi
 
          # Use sudo if user is not in docker group, otherwise use docker directly
          DOCKER_CMD="docker"
          if ! groups | grep -q docker; then
            DOCKER_CMD="sudo docker"
          fi
 
          # Login to Docker Hub if needed
          echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | $DOCKER_CMD login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin || true
 
          # Pull and run the container
          $DOCKER_CMD pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
          $DOCKER_CMD stop myapp || true
          $DOCKER_CMD rm myapp || true
          $DOCKER_CMD run -d --name myapp -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
          EOF
