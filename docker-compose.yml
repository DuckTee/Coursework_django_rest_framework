version: '3.8'

services:
  # Django + Gunicorn
  django:
    build: .
    command: /entrypoint.sh
    volumes:
      - ./app:/app
      - static_volume:/app/static
      - media_volume:/app/media
    env_file:
      - .env
    expose:
      - 8000
    depends_on:
      - db
      - redis

  # PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  # Redis (для Celery)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Celery Worker
  celery:
    build: .
    command: celery -A your_project worker -l info
    env_file:
      - .env
    depends_on:
      - django
      - redis
    volumes:
      - ./app:/app

  # Celery Beat (планировщик)
  celery-beat:
    build: .
    command: celery -A your_project beat -l info
    env_file:
      - .env
    depends_on:
      - django
      - redis
    volumes:
      - ./app:/app

  # Nginx (прокси)
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - django
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media

volumes:
  postgres_data:
  static_volume:
  media_volume:
